<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Catalogue</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
</head>
<body>
<main class="container">
    <h1 th:text="${title}">Catalogue</h1>

    <p th:if="${message}" class="flash" th:text="${message}"></p>

    <section class="panel">
        <h2>Filter by author</h2>
        <form method="get" action="/books" class="row-form">
            <input type="text" name="author" placeholder="e.g. Bloch" th:value="${author}">
            <button type="submit">Filter</button>
            <a class="button secondary" href="/books">Reset</a>
        </form>
    </section>

    <section class="panel">
        <h2>Add a book</h2>
        <form method="post" action="/books" class="book-form">
            <input required type="text" name="title" placeholder="Title">
            <input required type="text" name="author" placeholder="Author">
            <input required type="number" name="year" placeholder="Year" min="1" max="2100">
            <button type="submit">Add book</button>
        </form>
    </section>

    <table>
        <thead>
        <tr>
            <th>#</th>
            <th>Title</th>
            <th>Author</th>
            <th>Year</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.id}">1</td>
            <td th:text="${book.title}">Title</td>
            <td th:text="${book.author}">Author</td>
            <td th:text="${book.year}">2020</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
